services:
  spotimine:
    build: .
    ports:
      - "3200:5000"
      # Soulseek incoming connections. Without an open inbound port you can only
      # reach peers who have one open themselves, which shrinks the pool the
      # second pass depends on. Forward this at your router too.
      - "49998:49998"
    volumes:
      # Source mounted for development: a code change is a `docker compose
      # restart`, not a rebuild. The whole directory rather than a file-by-file
      # list, because that list goes stale silently — settings.py and
      # soulseek.py were both missing from it, and a module that is not mounted
      # is one that costs a full rebuild to change, which is the entire thing
      # this mount exists to avoid.
      # Delete this one line for an immutable deployment; the data mounts below
      # stand on their own.
      - .:/app
      # Downloaded songs and generated charts persist across restarts. Nested
      # inside the mount above, which is fine: the runtime mounts parents before
      # children, and these keep working once the source mount is removed.
      - ./songs:/app/songs
      - ./static/reports:/app/static/reports
      # YouTube Music cookies — the premium gate reads .spotimine/cookies.txt
      - ./.spotimine:/app/.spotimine
    environment:
      # No display in a container, so the interactive login tier is skipped
      # rather than attempted; refresh cookies on the host instead.
      - SPOTIMINE_UNATTENDED=1
      # Soulseek credentials for the second pass. Free account, created on first
      # login with an unused name. Leave unset and the pass skips itself.
      # Put the real values in a .env file beside this one, never in here.
      - SPOTIMINE_SLSK_USERNAME=${SPOTIMINE_SLSK_USERNAME:-}
      - SPOTIMINE_SLSK_PASSWORD=${SPOTIMINE_SLSK_PASSWORD:-}
      # Transcode detection records its verdict without rejecting until this is
      # set to 1. Review what it would have rejected first.
      - SPOTIMINE_SPECTRAL_ENFORCE=${SPOTIMINE_SPECTRAL_ENFORCE:-0}
    restart: unless-stopped
